name: Production release gate
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true
jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Enforce dev-to-main release and issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/validate-pr.mjs
      - name: Merge queue uses original PR checks
        if: github.event_name == 'merge_group'
        run: echo 'Release PR must be verified before entering the merge queue.'
  regression:
    name: Full regression and production build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: '3.12' }
      - run: npm ci
      - run: python -m pip install playwright beautifulsoup4 lxml
      - run: python -m playwright install --with-deps chromium
      - name: Expose Chromium for browser fixtures
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          with sync_playwright() as p:
              Path('/tmp/chromium-executable').write_text(p.chromium.executable_path)
          PY
          if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$(cat /tmp/chromium-executable)" /usr/bin/chromium; fi
      - run: node ci/run.mjs release
      - name: Upload release manifest and checksums
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-release-evidence-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: error
