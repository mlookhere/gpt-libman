name: PR CI
on:
  pull_request:
    branches: [dev]
  merge_group:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true
jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - name: Verify linked issue and PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/validate-pr.mjs
      - name: Merge queue carries verified PR metadata
        if: github.event_name == 'merge_group'
        run: echo 'Verified on original PR.'
  fast:
    name: Fast deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: node ci/run.mjs fast
  tests:
    name: PR test/build gates
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: '3.12' }
      - run: npm ci
      - run: python -m pip install playwright beautifulsoup4 lxml
      - run: python -m playwright install --with-deps chromium
      - name: Expose Chromium for browser fixtures
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          with sync_playwright() as p:
              Path('/tmp/chromium-executable').write_text(p.chromium.executable_path)
          PY
          if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$(cat /tmp/chromium-executable)" /usr/bin/chromium; fi
      - run: node ci/run.mjs pr
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-build-evidence-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: warn
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: node ci/run.mjs audit
