name: Nightly deep quality
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nightly:
    name: Nightly deep quality
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: '3.12' }
      - run: npm ci
      - run: python -m pip install playwright beautifulsoup4 lxml
      - run: python -m playwright install --with-deps chromium
      - name: Expose Chromium for browser fixtures
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          with sync_playwright() as p:
              Path('/tmp/chromium-executable').write_text(p.chromium.executable_path)
          PY
          if [ ! -e /usr/bin/chromium ]; then sudo ln -s "$(cat /tmp/chromium-executable)" /usr/bin/chromium; fi
      - run: node ci/run.mjs nightly
      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nightly-evidence-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: warn
